# Henter WCA's offentlige resultater hver mandag og opdaterer ranks/.
# Kan også startes i hånden under Actions → "Opdater WCA-ranglister" → Run workflow.
name: Opdater WCA-ranglister
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ranks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_ranks.py
      - name: Gem nye ranglister
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranks
          if git diff --cached --quiet; then echo "Ingen ændringer"; exit 0; fi
          git commit -m "Opdater WCA-ranglister"
          git push
