<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cube Timer</title>
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Timer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #111418;
    --panel: #1b1f25;
    --line: #2a3038;
    --text: #eef1f4;
    --muted: #8a94a0;
    --ready: #34d399;
    --hold: #f87171;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; flex: none; }
  header select { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 7px 8px; font-size: 16px; font-family: inherit; min-width: 0; }
  #puzzleSel { flex: none; font-weight: 600; }
  #sessionSel { flex: 1; }

  #scramble { margin: 8px 16px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; font: 600 19px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-align: center; word-spacing: 4px; min-height: 64px; max-height: 34vh; overflow-y: auto; }
  #scramble.mid { font-size: 16px; }
  #scramble.long { font-size: 13px; word-spacing: 2px; }
  #scramble small { display: block; font: 12px -apple-system, sans-serif; color: var(--muted); margin-top: 6px; }

  #scrImg { display: flex; justify-content: center; margin: 8px 16px 0; height: 96px; }
  #scrImg:empty { display: none; }
  #scrImg svg { height: 100%; width: auto; max-width: 100%; }

  #pad { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; min-height: 200px; }
  #time { font: 700 clamp(64px, 22vw, 120px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; transition: color .08s; }
  #hint { color: var(--muted); font-size: 14px; margin-top: 14px; height: 18px; }
  body.holding #time { color: var(--hold); }
  body.ready #time { color: var(--ready); }
  body.running header, body.running #scramble, body.running #stats, body.running #list, body.running #hint, body.running #scrImg { visibility: hidden; }

  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
  .stat b { display: block; font: 600 17px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  #list { margin: 10px 16px 12px; max-height: 26vh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px;
    -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #list:empty::before { content: "Ingen tider endnu"; color: var(--muted); font-size: 14px; }
  .t { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 9px;
    padding: 6px 10px; font: 15px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .t i { color: var(--muted); font-style: normal; font-size: 11px; margin-right: 6px; }
  .t.pb { border-color: var(--ready); }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; width: min(340px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 4px; font-size: 26px; font-family: ui-monospace, Menlo, monospace; }
  dialog p { margin: 0 0 14px; color: var(--muted); font: 13px ui-monospace, Menlo, monospace; white-space: pre-line; }
  dialog h3 { margin: 16px 0 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row button, .wide { background: #252b33; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 0; font-size: 15px; }
  .row button.on { border-color: var(--accent); color: var(--accent); }
  .wide { width: 100%; margin-top: 8px; }
  .danger { color: var(--hold); }
  label.opt { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 15px;
    border-bottom: 1px solid var(--line); }
  label.opt input { width: 22px; height: 22px; }
</style>
</head>
<body>
  <header>
    <select id="puzzleSel" aria-label="Puslespil"></select>
    <select id="sessionSel" aria-label="Session"></select>
    <button class="icon-btn" id="menuBtn">Menu</button>
  </header>

  <div id="scramble"></div>

  <div id="scrImg"></div>

  <div id="pad">
    <div id="time">0.00</div>
    <div id="hint">Hold fingeren på skærmen, og slip for at starte</div>
  </div>

  <div id="stats">
    <div class="stat"><b id="sBest">–</b><span>Bedste</span></div>
    <div class="stat"><b id="sAo5">–</b><span>Ao5</span></div>
    <div class="stat"><b id="sAo12">–</b><span>Ao12</span></div>
    <div class="stat"><b id="sCount">0</b><span>Antal</span></div>
  </div>

  <div id="list"></div>

  <dialog id="solveDlg">
    <h2 id="dTime"></h2>
    <p id="dScr"></p>
    <div class="row">
      <button id="dOk">OK</button>
      <button id="dP2">+2</button>
      <button id="dDnf">DNF</button>
    </div>
    <button class="wide danger" id="dDel">Slet tid</button>
    <button class="wide" id="dClose">Luk</button>
  </dialog>

  <dialog id="menuDlg">
    <label class="opt">15 sek. inspektion <input type="checkbox" id="optInspect"></label>
    <label class="opt">Skjul tid under løsning <input type="checkbox" id="optHide"></label>
    <label class="opt">Vis billede af scramble <input type="checkbox" id="optImg"></label>
    <button class="wide" id="newScr">Nyt scramble</button>
    <h3 id="menuSess">Session</h3>
    <button class="wide" id="newSess">Ny session</button>
    <button class="wide" id="renameSess">Omdøb session</button>
    <button class="wide danger" id="clearAll">Slet alle tider i session</button>
    <button class="wide danger" id="delSess">Slet session</button>
    <button class="wide" id="menuClose">Luk</button>
  </dialog>

<script>
(() => {
  // ---------- storage (safe) ----------
  // state: { inspect, hide, cur, last: {puzzle: sessionId}, sessions: [{ id, name, puzzle, solves }] }
  // solve: { ms, pen: 0 | 2 | "dnf", scr, at }
  const KEY = "cubetimer.v2", OLD_KEY = "cubetimer.v1";
  const rnd = n => Math.floor(Math.random() * n);
  function read(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
  function newSession(puzzle, name) {
    const s = { id: Date.now().toString(36) + rnd(1e6).toString(36), name, puzzle, solves: [] };
    state.sessions.push(s); return s;
  }
  let state = read(KEY);
  if (!state || !Array.isArray(state.sessions)) {
    // first run on this version: move the old 3x3 times into a session
    const old = read(OLD_KEY) || {};
    state = { inspect: !!old.inspect, hide: !!old.hide, cur: null, last: {}, sessions: [] };
    const s = newSession("333", "Session 1");
    if (Array.isArray(old.solves)) s.solves = old.solves;
    state.cur = s.id; save();
  }
  state.last = state.last || {};
  if (state.showImg === undefined) state.showImg = true;
  if (!state.sessions.length) state.cur = newSession("333", "Session 1").id;
  const sess = () => state.sessions.find(s => s.id === state.cur) || state.sessions[0];
  const solves = () => sess().solves;

  // ---------- puzzles & scrambles ----------
  // [id, name, csTimer scramble type, length, csTimer image type]
  const PUZZLES = [
    ["222", "2x2", "222so", 0, "222"], ["333", "3x3", "333", 0, "333"],
    ["444", "4x4", "444wca", 0, "444"], ["555", "5x5", "555wca", 60, "555"],
    ["666", "6x6", "666wca", 80, "666"], ["777", "7x7", "777wca", 100, "777"],
    ["333oh", "3x3 OH", "333", 0, "333"], ["333bf", "3x3 Blind", "333ni", 0, "333"],
    ["pyram", "Pyraminx", "pyrso", 10, "pyrso"], ["skewb", "Skewb", "skbso", 0, "skbso"],
    ["minx", "Megaminx", "mgmp", 70, "mgmp"], ["sq1", "Square-1", "sqrs", 0, "sqrs"],
    ["clock", "Clock", "clkwca", 0, "clkwca"],
  ];
  const puzzleInfo = id => PUZZLES.find(p => p[0] === id) || PUZZLES[1];
  const puzzleName = id => puzzleInfo(id)[1];

  // NxN random-move scramble. Wide moves: Rw = 2 layers, 3Rw = 3 layers.
  const AXIS = { U: 0, D: 0, R: 1, L: 1, F: 2, B: 2 };
  function cubeScramble(n, len) {
    const faces = n === 2 ? ["U", "R", "F"] : ["U", "D", "R", "L", "F", "B"];
    const maxD = Math.floor(n / 2), moves = [];
    for (const f of faces) for (let d = 1; d <= maxD; d++) {
      // on even cubes the middle-depth wide moves only need U, R and F
      if (n % 2 === 0 && d === maxD && d > 1 && "DLB".includes(f)) continue;
      moves.push({ f, d });
    }
    const out = []; let run = [];  // run = moves in a row on the same axis
    while (out.length < len) {
      const m = moves[rnd(moves.length)];
      if (run.length && AXIS[run[0].f] !== AXIS[m.f]) run = [];
      if (run.some(r => r.f === m.f && r.d === m.d)) continue;
      run.push(m);
      const name = m.d === 1 ? m.f : m.d === 2 ? m.f + "w" : m.d + m.f + "w";
      out.push(name + ["", "'", "2"][rnd(3)]);
    }
    return out.join(" ");
  }
  function cornerTwistScramble(faces, len, tips) {
    const out = []; let last = "";
    while (out.length < len) {
      const f = faces[rnd(faces.length)];
      if (f === last) continue;
      last = f; out.push(f + (rnd(2) ? "'" : ""));
    }
    if (tips) for (const t of "ulrb") { const r = rnd(3); if (r) out.push(t + (r === 2 ? "'" : "")); }
    return out.join(" ");
  }
  function megaScramble() {
    const lines = [];
    for (let i = 0; i < 7; i++) {
      const l = [];
      for (let j = 0; j < 10; j++) l.push((j % 2 ? "D" : "R") + (rnd(2) ? "++" : "--"));
      l.push(rnd(2) ? "U" : "U'");
      lines.push(l.join(" "));
    }
    return lines.join("\n");
  }
  function clockScramble() {
    const v = () => { const x = rnd(12) - 5; return x >= 0 ? x + "+" : -x + "-"; };
    const a = ["UR", "DR", "DL", "UL", "U", "R", "D", "L", "ALL"].map(p => p + v());
    const b = ["U", "R", "D", "L", "ALL"].map(p => p + v());
    const pins = ["UR", "DR", "DL", "UL"].filter(() => rnd(2));
    return [...a, "y2", ...b, ...pins].join(" ");
  }
  function makeScramble() {
    switch (sess().puzzle) {
      case "222": return cubeScramble(2, 10);
      case "444": return cubeScramble(4, 40);
      case "555": return cubeScramble(5, 60);
      case "666": return cubeScramble(6, 80);
      case "777": return cubeScramble(7, 100);
      case "pyram": return cornerTwistScramble("ULRB", 8 + rnd(3), true);
      case "skewb": return cornerTwistScramble("RULB", 8 + rnd(3), false);
      case "minx": return megaScramble();
      case "clock": return clockScramble();
      case "sq1": return "Kunne ikke lave Square-1-scramble. Tryk for at prøve igen.";
      default: return cubeScramble(3, 20);
    }
  }
  // ---------- csTimer scrambles (runs in a web worker) ----------
  // csTimer makes random-state scrambles like in competitions. The simple
  // generator above is only a fallback if the worker can't run.
  const cst = (() => {
    let worker = null, id = 0; const waiting = {};
    try {
      worker = new Worker("cstimer_module.js");
      worker.onmessage = e => { const [i, , ret] = e.data; waiting[i]?.resolve(ret); delete waiting[i]; };
      worker.onerror = () => { worker = null; for (const k in waiting) { waiting[k].reject(); delete waiting[k]; } };
    } catch { worker = null; }
    return (type, args, timeout = 8000) => new Promise((resolve, reject) => {
      if (!worker) return reject();
      const i = ++id; waiting[i] = { resolve, reject };
      worker.postMessage([i, type, args]);
      setTimeout(() => { if (waiting[i]) { delete waiting[i]; reject(); } }, timeout);
    });
  })();
  const fetchScramble = p => {
    const [, , type, len] = puzzleInfo(p);
    return cst("scramble", [type, len]).then(s => s && s.split("\n").map(l => l.trim()).join("\n").trim());
  };

  let scramble = "", scrToken = 0;
  const ready = {};  // puzzle -> next scramble made in advance
  function prefetch(p) {
    if (ready[p]) return;
    ready[p] = fetchScramble(p).catch(() => null);
  }
  async function newScramble() {
    const p = sess().puzzle, token = ++scrToken;
    let next = ready[p] ? await ready[p] : null;
    delete ready[p];
    if (token !== scrToken) return;
    if (!next) {
      $("scramble").className = ""; $("scramble").innerHTML = "Laver scramble …";
      next = await fetchScramble(p).catch(() => null);
      if (token !== scrToken) return;
    }
    scramble = next || makeScramble();
    renderScramble();
    prefetch(p);
  }

  // ---------- formatting & stats ----------
  const value = s => s.pen === "dnf" ? Infinity : s.ms + (s.pen === 2 ? 2000 : 0);
  function fmt(ms) {
    if (ms === Infinity) return "DNF";
    if (ms == null || isNaN(ms)) return "–";
    const cs = Math.floor(ms / 10);
    const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
    const ss = m ? String(s).padStart(2, "0") : String(s);
    return (m ? m + ":" : "") + ss + "." + String(c).padStart(2, "0");
  }
  const fmtSolve = s => s.pen === "dnf" ? "DNF" : fmt(value(s)) + (s.pen === 2 ? "+" : "");
  function avg(n) {
    if (solves().length < n) return null;
    const v = solves().slice(-n).map(value).sort((a, b) => a - b);
    const mid = v.slice(1, -1);
    if (mid.includes(Infinity)) return Infinity;
    return mid.reduce((a, b) => a + b, 0) / mid.length;
  }

  // ---------- render ----------
  const $ = id => document.getElementById(id);
  const timeEl = $("time"), hintEl = $("hint");
  function renderScramble() {
    const el = $("scramble");
    el.className = scramble.length > 130 ? "long" : scramble.length > 70 ? "mid" : "";
    el.innerHTML = scramble.replace(/\n/g, "<br>") + "<small>Tryk her for nyt scramble</small>";
    el.scrollTop = 0;
    const img = $("scrImg"), shown = scramble;
    if (!state.showImg) { img.innerHTML = ""; return; }
    cst("image", [shown, puzzleInfo(sess().puzzle)[4]]).then(svg => {
      // give the image a viewBox so it scales to fit the box
      if (shown === scramble) img.innerHTML = (svg || "").replace(/<svg width="([\d.]+)" height="([\d.]+)"/, '<svg viewBox="0 0 $1 $2"');
    }).catch(() => { img.innerHTML = ""; });
  }
  function renderSelects() {
    const cur = sess();
    $("puzzleSel").innerHTML = PUZZLES.map(([id, name]) =>
      `<option value="${id}"${id === cur.puzzle ? " selected" : ""}>${name}</option>`).join("");
    const sel = $("sessionSel");
    sel.innerHTML = "";
    for (const s of state.sessions.filter(s => s.puzzle === cur.puzzle)) {
      sel.add(new Option(`${s.name} (${s.solves.length})`, s.id, false, s.id === cur.id));
    }
    sel.add(new Option("＋ Ny session …", "__new"));
  }
  function render() {
    renderSelects();
    const vals = solves().map(value);
    const best = vals.length ? Math.min(...vals) : null;
    $("sBest").textContent = best == null ? "–" : fmt(best);
    $("sAo5").textContent = fmt(avg(5));
    $("sAo12").textContent = fmt(avg(12));
    $("sCount").textContent = solves().length;
    const list = $("list");
    list.innerHTML = "";
    for (let i = solves().length - 1; i >= 0; i--) {
      const s = solves()[i];
      const b = document.createElement("button");
      b.className = "t" + (best !== Infinity && value(s) === best ? " pb" : "");
      b.innerHTML = `<i>${i + 1}</i>${fmtSolve(s)}`;
      b.onclick = () => openSolve(i);
      list.appendChild(b);
    }
  }

  // ---------- timer state machine ----------
  // idle -> (inspect) -> holding -> ready -> running -> idle
  let phase = "idle", t0 = 0, raf = 0, holdTimer = 0, inspectStart = 0, inspectPen = 0;
  const HOLD_MS = 300;

  function setBody() {
    document.body.className = phase === "holding" ? "holding" : phase === "ready" ? "ready" : phase === "running" ? "running" : "";
  }
  function tick() {
    if (phase === "running") {
      timeEl.textContent = state.hide ? "…" : fmt(performance.now() - t0);
    } else if (phase === "inspect" || ((phase === "holding" || phase === "ready") && inspectStart)) {
      const left = 15 - Math.floor((performance.now() - inspectStart) / 1000);
      timeEl.textContent = left > 0 ? left : left > -2 ? "+2" : "DNF";
    }
    raf = requestAnimationFrame(tick);
  }

  function press() {
    if (phase === "running") { stop(); return; }
    if (phase === "idle" && state.inspect) {
      phase = "inspect"; inspectStart = performance.now();
      hintEl.textContent = "Inspektion – hold for at gøre klar";
      wakeLock(); setBody(); return;
    }
    if (phase === "idle" || phase === "inspect") {
      phase = "holding"; setBody();
      if (!inspectStart) timeEl.textContent = "0.00";
      holdTimer = setTimeout(() => { if (phase === "holding") { phase = "ready"; setBody(); } }, HOLD_MS);
    }
  }
  function release() {
    clearTimeout(holdTimer);
    if (phase === "ready") start();
    else if (phase === "holding") { phase = inspectStart ? "inspect" : "idle"; setBody(); }
  }
  function start() {
    if (inspectStart) {
      const over = (performance.now() - inspectStart) / 1000 - 15;
      inspectPen = over > 2 ? "dnf" : over > 0 ? 2 : 0;
    } else inspectPen = 0;
    inspectStart = 0;
    phase = "running"; t0 = performance.now(); setBody(); wakeLock();
  }
  function stop() {
    const ms = Math.round(performance.now() - t0);
    phase = "idle"; setBody();
    const s = { ms, pen: inspectPen, scr: scramble, at: Date.now() };
    solves().push(s); save();
    timeEl.textContent = fmtSolve(s);
    hintEl.textContent = "Tryk på en tid nedenfor for +2, DNF eller slet";
    newScramble(); render();
    releaseWake();
    // ignore the release of this same touch
    ignoreNextRelease = true;
  }
  let ignoreNextRelease = false;

  const pad = $("pad");
  const down = e => { e.preventDefault(); if (document.querySelector("dialog[open]")) return; press(); };
  const up = e => { e.preventDefault(); if (ignoreNextRelease) { ignoreNextRelease = false; return; } release(); };
  pad.addEventListener("touchstart", down, { passive: false });
  pad.addEventListener("touchend", up, { passive: false });
  pad.addEventListener("touchcancel", up, { passive: false });
  // stopping must work anywhere on screen
  document.addEventListener("touchstart", e => { if (phase === "running" && !pad.contains(e.target)) { e.preventDefault(); stop(); } }, { passive: false });
  document.addEventListener("touchend", e => { if (!pad.contains(e.target) && ignoreNextRelease) { e.preventDefault(); ignoreNextRelease = false; } }, { passive: false });
  // mouse / keyboard for testing on a computer
  pad.addEventListener("mousedown", e => { if (e.button === 0) press(); });
  pad.addEventListener("mouseup", () => { if (ignoreNextRelease) { ignoreNextRelease = false; return; } release(); });
  let keyDown = false;
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || document.querySelector("dialog[open]")) return;
    e.preventDefault(); if (keyDown) return; keyDown = true; press();
  });
  document.addEventListener("keyup", e => {
    if (e.code !== "Space") return;
    keyDown = false; if (ignoreNextRelease) { ignoreNextRelease = false; return; } release();
  });

  // ---------- screen wake lock ----------
  let lock = null;
  async function wakeLock() { try { lock = await navigator.wakeLock?.request("screen"); } catch {} }
  function releaseWake() { try { lock?.release(); } catch {} lock = null; }

  // ---------- dialogs ----------
  let cur = -1;
  function openSolve(i) {
    cur = i; const s = solves()[i];
    $("dTime").textContent = fmtSolve(s);
    $("dScr").textContent = s.scr;
    $("dOk").classList.toggle("on", s.pen === 0);
    $("dP2").classList.toggle("on", s.pen === 2);
    $("dDnf").classList.toggle("on", s.pen === "dnf");
    $("solveDlg").showModal();
  }
  function setPen(p) { solves()[cur].pen = p; save(); render(); openSolveRefresh(); }
  function openSolveRefresh() { $("solveDlg").close(); openSolve(cur); }
  $("dOk").onclick = () => setPen(0);
  $("dP2").onclick = () => setPen(2);
  $("dDnf").onclick = () => setPen("dnf");
  $("dDel").onclick = () => { solves().splice(cur, 1); save(); render(); $("solveDlg").close(); timeEl.textContent = "0.00"; };
  $("dClose").onclick = () => $("solveDlg").close();

  // ---------- sessions ----------
  function switchTo(id) {
    state.cur = id; state.last[sess().puzzle] = id; save();
    newScramble(); render();
    timeEl.textContent = "0.00";
    hintEl.textContent = "Hold fingeren på skærmen, og slip for at starte";
  }
  function createSession() {
    const p = sess().puzzle;
    const n = state.sessions.filter(s => s.puzzle === p).length + 1;
    const name = prompt(`Navn på ny ${puzzleName(p)}-session:`, "Session " + n);
    if (name === null) { render(); return false; }
    switchTo(newSession(p, name.trim() || "Session " + n).id);
    return true;
  }
  $("puzzleSel").onchange = e => {
    const p = e.target.value;
    const list = state.sessions.filter(s => s.puzzle === p);
    const target = list.find(s => s.id === state.last[p]) || list[0] || newSession(p, "Session 1");
    switchTo(target.id);
  };
  $("sessionSel").onchange = e => {
    if (e.target.value === "__new") createSession();
    else switchTo(e.target.value);
  };

  $("menuBtn").onclick = () => {
    $("optInspect").checked = state.inspect; $("optHide").checked = state.hide; $("optImg").checked = state.showImg;
    $("menuSess").textContent = `Session: ${puzzleName(sess().puzzle)} – ${sess().name}`;
    $("menuDlg").showModal();
  };
  $("optInspect").onchange = e => { state.inspect = e.target.checked; save(); };
  $("optHide").onchange = e => { state.hide = e.target.checked; save(); };
  $("optImg").onchange = e => { state.showImg = e.target.checked; save(); if (scramble) renderScramble(); };
  $("newScr").onclick = () => { newScramble(); $("menuDlg").close(); };
  $("newSess").onclick = () => { if (createSession()) $("menuDlg").close(); };
  $("renameSess").onclick = () => {
    const name = prompt("Nyt navn til sessionen:", sess().name);
    if (name && name.trim()) { sess().name = name.trim(); save(); render(); $("menuDlg").close(); }
  };
  $("clearAll").onclick = () => {
    if (confirm(`Slet alle tider i "${sess().name}"?`)) { sess().solves = []; save(); render(); timeEl.textContent = "0.00"; $("menuDlg").close(); }
  };
  $("delSess").onclick = () => {
    const s = sess();
    if (!confirm(`Slet sessionen "${s.name}" og alle dens ${s.solves.length} tider?`)) return;
    state.sessions = state.sessions.filter(x => x !== s);
    const rest = state.sessions.filter(x => x.puzzle === s.puzzle);
    switchTo((rest[0] || newSession(s.puzzle, "Session 1")).id);
    $("menuDlg").close();
  };
  $("menuClose").onclick = () => $("menuDlg").close();
  $("scramble").onclick = () => { if (phase === "idle") newScramble(); };

  newScramble(); render(); tick();

  // ---------- offline ----------
  if ("serviceWorker" in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => {
      // check for a new version every time the app comes back to the front
      document.addEventListener("visibilitychange", () => { if (!document.hidden) r.update().catch(() => {}); });
    }).catch(() => {});
    // a new version took over: reload once, but never in the middle of a solve
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloaded) return;
      const go = () => { if (phase === "idle") { reloaded = true; location.reload(); } else setTimeout(go, 1000); };
      go();
    });
  }
})();
</script>
</body>
</html>
